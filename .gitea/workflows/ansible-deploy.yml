name: "Ansible Deploy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (dev/prod), must match folder name, e.g. terraform/env/dev"
        required: true
        type: string
      vm_name:
        description: "VM name (e.g. dev01 / prod01), must match tfvars file"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TF_INPUT: "0"

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Set + Validate Variables
      # -------------------------------------------------------------------
      - name: Set Variables
        id: vars
        env:
          IN_ENV: ${{ inputs.environment }}
          IN_VM: ${{ inputs.vm_name }}
        run: |
          ENV=$(echo "$IN_ENV" | tr '[:upper:]' '[:lower:]')
          VM="$IN_VM"

          if [ "$ENV" != "dev" ] && [ "$ENV" != "prod" ]; then
            echo "::error:: Invalid environment: $ENV (allowed: dev, prod)"
            exit 1
          fi

          if ! [[ "$VM" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error:: Invalid vm_name: $VM"
            exit 1
          fi

          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "vm_name=$VM" >> $GITHUB_OUTPUT
          echo "working_dir=terraform" >> $GITHUB_OUTPUT
          echo "state_key=state/${ENV}/${VM}/terraform.tfstate" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible netcat-openbsd

      # -------------------------------------------------------------------
      # Setup Terraform (wrapper off so `terraform output` returns clean text)
      # -------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ steps.vars.outputs.working_dir }}
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: |
          cat > backend.hcl <<EOF
          bucket = "tfstate"
          key    = "${{ steps.vars.outputs.state_key }}"
          region = "us-east-1"

          endpoints = { s3 = "${S3_ENDPOINT}" }

          use_path_style              = true
          use_lockfile                = true
          skip_credentials_validation = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_s3_checksum            = true
          EOF

          terraform init -backend-config=backend.hcl

      # -------------------------------------------------------------------
      # Get VM IP from Terraform state
      # -------------------------------------------------------------------
      - name: Get VM IP
        id: tfout
        working-directory: ${{ steps.vars.outputs.working_dir }}
        run: |
          IP=$(terraform output -raw vm_ip)

          if ! [[ "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error:: vm_ip is empty or invalid: '$IP' (has terraform apply run for this VM?)"
            exit 1
          fi

          echo "vm_ip=$IP" >> $GITHUB_OUTPUT

      - name: Wait for SSH
        env:
          VM_IP: ${{ steps.tfout.outputs.vm_ip }}
        run: |
          for i in {1..30}; do
            if nc -z -w 5 "$VM_IP" 22; then
              echo "SSH is up"
              exit 0
            fi
            echo "Waiting for SSH ($i/30)..."
            sleep 10
          done
          echo "::error:: SSH not ready on $VM_IP"
          exit 1

      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Create Inventory
        env:
          VM_IP: ${{ steps.tfout.outputs.vm_ip }}
        run: |
          cat > inventory.ini <<EOF
          [vm]
          ${VM_IP} ansible_user=ansible ansible_ssh_private_key_file=$HOME/.ssh/id_rsa
          EOF

      - name: Ansible Deploy
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook -i inventory.ini ansible/playbook.yml

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/id_rsa
        